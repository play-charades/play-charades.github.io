<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA redirect: preserve the path as a query param
        var path = window.location.pathname;
        window.location.replace('/?p=' + encodeURIComponent(path));
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
